{% extends "layouts/base.html" %}
{% block title %}{{ project.FONT_BRAND }} · {{ project.FONT_LANGUAGE }} - Playground{% endblock %}
{% block style %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        {% for font_size in options.FONT_SIZES %}
        {% with font_family = project.FILE_NAME_PREFIX ~ '-' ~ project.FONT_LANGUAGE.lower() ~ '-' ~ font_size ~ 'px' %}
        @font-face {
            font-family: {{ font_family }};
            src: url("{{ font_family }}.otf.woff2");
        }
        .font-{{ font_size }}px {
            font-size: {{ font_size * 2 }}px;
            font-family: {{ font_family }}, sans-serif;
        }
        {% endwith %}
        {% endfor %}
        .toolbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
        }
        .options-group {
            height: 36px;
            display: flex;
            flex-direction: row;
            background-color: #ffd339;
        }
        .option {
            height: 100%;
            margin-left: 24px;
            margin-right: 24px;
            display: flex;
            flex-direction: row;
            align-items: center;
            color: #4b4b4b;
            font-family: {{ project.FILE_NAME_PREFIX }}-{{ project.FONT_LANGUAGE.lower() }}-12px, sans-serif;
            font-size: 24px;
            line-height: 36px;
        }
        .option input[type="radio"] {
            display: none;
        }
        .option input[type="radio"] + span {
            width: 10px;
            height: 10px;
            margin-left: 12px;
            margin-right: 12px;
            border-width: 2px;
            border-color: #4b4b4b;
            border-style: solid;
        }
        .option input[type="radio"]:checked + span {
            background-color: #4b4b4b;
        }
        .content {
            position: fixed;
            top: 36px;
            bottom: 0;
            left: 0;
            right: 0;
        }
        .content textarea {
            width: 100%;
            height: 100%;
            padding: 24px;
            color: #4b4b4b;
            outline: none;
            border: none;
            resize: none;
        }
    </style>
{% endblock %}
{% block body %}
    <div class="toolbar">
        <div class="options-group">
            {% for font_size in options.FONT_SIZES %}
            <label class="option">
                <input id="radio-font-size-{{ font_size }}" name="font_size" type="radio" onchange="onFontSizeChange('{{ font_size }}')">
                <span></span>
                {{ font_size }}px
            </label>
            {% endfor %}
        </div>
    </div>
    <label class="content">
        <textarea id="input-box" placeholder="ⴰⵔⴰ ⵎⴰ ⵜⵔⵉⴷ... / Please input something..."></textarea>
    </label>
    <script type="module">
        const settings = {
            fontSize: 12,
        }
        const json = localStorage.getItem('{{ project.FILE_NAME_PREFIX }}-font-{{ project.FONT_LANGUAGE.lower() }}:settings:playground')
        if (json) {
            Object.assign(settings, JSON.parse(json))
        }

        const inputBox = document.getElementById('input-box')

        window.applySettings = () => {
            localStorage.setItem('{{ project.FILE_NAME_PREFIX }}-font-{{ project.FONT_LANGUAGE.lower() }}:settings:playground', JSON.stringify(settings))
            inputBox.className = 'font-' + settings.fontSize + 'px'
        }

        window.onFontSizeChange = fontSize => {
            settings.fontSize = fontSize
            window.applySettings()
        }

        document.getElementById('radio-font-size-' + settings.fontSize).checked = true
        window.applySettings()
    </script>
{% endblock %}
